<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FitKid · CRM</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#185fa5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="https://lirp.cdn-website.com/ce8372ef/dms3rep/multi/opt/FitKidGimnastic-Logo-89199942-1920w.jpeg">

<style>
  /* ---- FitKid Design System · tokens (mismos que index.html) ---- */
  :root{
    --brand-700:#0c447c; --brand-600:#185fa5; --brand-500:#2477c9; --brand-bg:#e8f1fb;
    --energy:#ef7d2e; --energy-bg:#fdeede;
    --bg:#eef2f7; --surface:#ffffff; --surface-2:#f7f9fc; --line:#e3e8f0; --line-2:#d3dae6;
    --text:#13151a; --muted:#667085; --hint:#9aa3b2;
    --teal:#0f6e56; --teal-bg:#e1f5ee; --blue:#185fa5; --blue-bg:#e6f1fb; --green:#3b6d11; --green-bg:#eaf3de;
    --purple:#534ab7; --purple-bg:#eeedfe; --pink:#993556; --pink-bg:#fbeaf0; --amber:#854f0b; --amber-bg:#faeeda;
    --ok:#0f6e56; --ok-bg:#e1f5ee; --danger:#a32d2d; --danger-bg:#fcebeb;
    --r-lg:16px; --r:13px; --r-sm:10px; --r-pill:999px;
    --sp-1:6px; --sp-2:10px; --sp-3:14px; --sp-4:18px; --sp-5:24px;
    --sh-sm:0 1px 2px rgba(16,24,40,.05); --sh-md:0 6px 20px rgba(16,30,54,.08); --sh-lg:0 14px 40px rgba(16,30,54,.14);
    --logo:url("https://lirp.cdn-website.com/ce8372ef/dms3rep/multi/opt/FitKidGimnastic-Logo-89199942-1920w.jpeg");
    --nav-w:220px; --right-w:300px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--brand-500);outline-offset:2px;border-radius:8px}
  button{font-family:inherit}

  /* ---- login (pantalla completa, reusa estilo de index.html) ---- */
  .loginwrap{max-width:420px;margin:0 auto;padding:40px 18px}
  .hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px;color:#fff;margin-bottom:var(--sp-4);box-shadow:var(--sh-md);background:linear-gradient(120deg,var(--brand-700),var(--brand-500))}
  .hlogo{width:46px;height:46px;border-radius:13px;background:#fff var(--logo) center/82% no-repeat;box-shadow:var(--sh-sm);flex:0 0 auto;margin:0 auto 10px}
  .htit{font-weight:700;font-size:19px;line-height:1.1;letter-spacing:-.2px}
  .hsub{font-size:12.5px;opacity:.92;margin-top:2px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm)}
  .field{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px;margin-bottom:10px;font-family:inherit}
  .field:focus{border-color:var(--brand-500);outline:none;box-shadow:0 0 0 4px var(--brand-bg)}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);font-size:14px;cursor:pointer;color:var(--text);transition:.13s;box-shadow:var(--sh-sm)}
  .btn:hover{background:var(--surface-2);border-color:var(--line-2)} .btn:active{transform:scale(.98)}
  .btn.pri{background:var(--brand-600);border-color:var(--brand-600);color:#fff;box-shadow:0 4px 12px rgba(24,95,165,.28)} .btn.pri:hover{background:var(--brand-500)}
  .mut{font-size:12px;color:var(--muted)}
  .footer{margin-top:var(--sp-5);text-align:center;font-size:11.5px;color:var(--hint)}

  /* ---- shell de 3 paneles ---- */
  .shell{display:grid;grid-template-columns:var(--nav-w) 1fr var(--right-w);min-height:100vh}
  .navcol{background:var(--brand-700);color:#fff;padding:18px 12px;display:flex;flex-direction:column}
  .navbrand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
  .navbrand .hlogo{margin:0}
  .navbrand b{font-size:14px}
  .navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .navlist button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:transparent;color:rgba(255,255,255,.75);border-radius:var(--r-sm);font-size:13.5px;cursor:pointer;text-align:left}
  .navlist button:hover{background:rgba(255,255,255,.08);color:#fff}
  .navlist button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
  .navlist button[disabled]{cursor:default;opacity:.45}
  .navlist button[disabled]:hover{background:transparent;color:rgba(255,255,255,.75)}
  .navlist .soon{margin-left:auto;font-size:9.5px;background:rgba(255,255,255,.14);padding:2px 7px;border-radius:var(--r-pill)}
  .navfoot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
  .navfoot a,.navfoot button{color:rgba(255,255,255,.75);font-size:12.5px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r-sm);text-decoration:none;border:none;background:transparent;cursor:pointer;width:100%;text-align:left}
  .navfoot a:hover,.navfoot button:hover{background:rgba(255,255,255,.08);color:#fff}

  .centercol{padding:22px 24px;overflow:auto}
  .pagehead{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px} .pagehead h1{white-space:nowrap}
  .pagehead h1{font-size:20px;margin:0;letter-spacing:-.2px}
  .pagehead .mut{font-size:12.5px}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .statcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh-sm)}
  .statcard .v{font-size:22px;font-weight:700;color:var(--brand-600)}
  .statcard .l{font-size:12px;color:var(--muted);margin-top:2px}
  .placeholder{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted)}
  .dirtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .dirtab{padding:7px 13px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);font-size:12.5px;color:var(--muted);cursor:pointer}
  .dirtab.on{background:var(--brand-600);border-color:var(--brand-600);color:#fff}
  .dirlist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .dirrow{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer}
  .dirrow:hover{border-color:var(--line-2);background:var(--surface-2)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-bg);color:var(--brand-600);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:0 0 auto}
  .nm{font-weight:600;font-size:14px}
  .pill{font-size:10px;padding:2px 7px;border-radius:var(--r-pill);margin-left:6px;font-weight:600}
  .pill.warn{background:var(--amber-bg);color:var(--amber)}
  .weeknav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .cal{border-collapse:separate;border-spacing:4px;width:100%;min-width:520px}
  .cal th{font-size:11px;color:var(--muted);font-weight:600;padding:2px 4px;text-align:center}
  .cal .calb{font-size:11px;color:var(--muted);white-space:nowrap;padding-right:6px}
  .gchip{display:inline-block;margin-left:5px;padding:1px 7px;border-radius:var(--r-pill);font-size:10px;font-weight:600}
  .gchip.nina{background:var(--pink-bg);color:var(--pink)} .gchip.nino{background:var(--blue-bg);color:var(--blue)}
  .calc{width:100%;min-width:54px;padding:8px 4px;border:1px solid var(--line);border-radius:9px;background:var(--brand-bg);color:var(--brand-600);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
  .calc:hover{border-color:var(--brand-500)}
  .calc.full{background:var(--danger-bg);color:var(--danger)}
  .calc .ok2{display:block;font-size:10px;font-weight:500;color:var(--ok)}
  .rosterfoot{position:sticky;bottom:0;background:var(--surface);padding:12px 0 4px;margin-top:10px;border-top:1px solid var(--line)}
  .rosterrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
  .rosterrow:last-child{border-bottom:none}
  .rosterrow .nm{font-size:13px}
  .miniavatar{width:28px;height:28px;border-radius:50%;background:var(--brand-bg);color:var(--brand-600);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;flex:0 0 auto}
  .mkbtn{padding:5px 9px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);font-size:11px;cursor:pointer}
  .mkbtn.on-ok{background:var(--ok-bg);border-color:#bfe3d5;color:var(--ok)}
  .mkbtn.on-dng{background:var(--danger-bg);border-color:#f0c7c7;color:var(--danger)}

  .acts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .actbtn{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;text-align:left;font-family:inherit;color:var(--text);min-height:48px}
  .actbtn:hover{border-color:var(--line-2);background:var(--surface-2)}
  .actbtn i{font-size:20px;color:var(--brand-600);flex:0 0 auto}
  .actbtn span{display:flex;flex-direction:column;min-width:0}
  .actbtn b{font-size:13.5px}
  .actbtn small{font-size:11.5px;color:var(--muted)}
  .actbtn.prim{border-color:var(--brand-500);background:var(--brand-bg)}
  .actbtn.ok{border-color:#bfe3d5;background:var(--ok-bg)} .actbtn.ok i{color:var(--ok)}
  .actbtn.dng{border-color:#f0c7c7;background:var(--danger-bg)} .actbtn.dng i{color:var(--danger)}
  .actbtn.warn{border-color:#f1d9b0;background:var(--amber-bg)} .actbtn.warn i{color:var(--amber)}
  .masacc{margin-bottom:14px} .masacc summary{cursor:pointer;font-size:13px;color:var(--brand-600);font-weight:600;padding:6px 0;list-style:none} .masacc summary::-webkit-details-marker{display:none} .masacc summary::before{content:'+ '} .masacc[open] summary::before{content:'– '}
  .masacc .acts{margin-top:8px}
  .chipsel{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
  .chipo{padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--text);min-height:38px;text-align:left}
  .chipsel[data-grp="plan"]{display:grid;grid-template-columns:1fr 1fr}
  .chipo.on{background:var(--brand-600);border-color:var(--brand-600);color:#fff}
  .chipo.on .gchip{background:rgba(255,255,255,.22);color:#fff}
  .rightcol label.mut{display:block;margin:10px 0 4px}
  .rightcol .field{width:100%;margin-bottom:8px}
  .acbig{width:100%;justify-content:center;min-height:46px;margin-top:10px;text-decoration:none}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin:10px 0}
  .crmtoast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));z-index:50;background:var(--text);color:#fff;padding:11px 16px;border-radius:var(--r-pill);font-size:13px;box-shadow:var(--sh-lg);max-width:calc(100% - 32px)}
  .crmtoast.ok{background:var(--ok)} .crmtoast.dng{background:var(--danger)}
  .chkcard{padding:16px}
  .camwrap{position:relative;border-radius:var(--r);overflow:hidden;background:#000;max-width:520px;aspect-ratio:4/3}
  .camwrap video{width:100%;height:100%;object-fit:cover;display:block}
  .cammark{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
  .chkres{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:14px}
  .chkres>i{font-size:28px;flex:0 0 auto} .chkres b{font-size:16px}
  .chkres.ok{background:var(--ok-bg);border-color:#bfe3d5} .chkres.ok>i{color:var(--ok)}
  .chkres.warn{background:var(--amber-bg);border-color:#f1d9b0} .chkres.warn>i{color:var(--amber)}
  .chkres.dng{background:var(--danger-bg);border-color:#f0c7c7} .chkres.dng>i{color:var(--danger)}
  .chkres.info{background:var(--brand-bg);border-color:#c9dcf1} .chkres.info>i{color:var(--brand-600)}
  .chkalert{margin:6px 0 0;padding-left:18px;color:var(--amber);font-size:13px}
  button.dirrow{width:100%;font-family:inherit;color:inherit}
  .qrcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
  .qrcard img{width:220px;height:220px;image-rendering:pixelated}
  body.kiosk-on{overflow:hidden}
  body.kiosk-on #fk{display:none}
  #kiosco{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
  .kiohead{display:flex;align-items:center;justify-content:space-between;background:var(--brand-700);color:#fff;padding:14px 18px}
  .kiohead b{font-size:17px} .kioclock{font-size:13px;opacity:.85}
  .kiounlock{position:absolute;inset:0;z-index:5;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}
  .kiounlock .card{width:100%;max-width:360px;padding:18px}
  .kiolock{width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer}
  .kiobody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px;overflow:auto}
  .kioscan .camwrap{max-width:none}
  .kioroster h2{font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:0 0 10px}
  #kiolista{display:flex;flex-direction:column;gap:8px}
  .kiorow{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);font-size:16px;font-family:inherit;text-align:left;cursor:pointer;color:var(--text)}
  .kiorow span{flex:1} .kiorow.hecho{background:var(--ok-bg);border-color:#bfe3d5;color:var(--ok);cursor:default} .kiorow.hecho i{font-size:22px}
  @media (max-width:760px){ .kiobody{grid-template-columns:1fr} }
  .kiosel{display:block}
  .chkresp{margin:8px 0;padding:8px 10px;border-radius:var(--r-sm);background:var(--danger-bg);color:var(--danger);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center} .chkresp .btn{padding:5px 10px;min-height:0}
  .evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:18px}
  button.evcard{display:block;width:100%;text-align:left;font-family:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh-sm);cursor:pointer} button.evcard.on{border-color:var(--brand-600);box-shadow:0 0 0 2px var(--brand-bg)}
  .evtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px} .evtop .pill{margin-left:0;white-space:nowrap}
  .evins{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)} .evins .pill{margin-left:4px}
  .evpas summary{cursor:pointer;margin-bottom:10px}
  .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.info{background:var(--brand-bg);color:var(--brand-700)} .pill.gris{background:var(--line);color:var(--muted)}
  .vtabla{padding:0;overflow-x:auto} .vtabla table{width:100%;border-collapse:collapse;font-size:13.5px} .vtabla th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)} .vtabla td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top} .vtabla tr:last-child td{border-bottom:0} .vtabla .num{text-align:right;white-space:nowrap} .vtabla tr.pend td{opacity:.7}
  .vacc{display:flex;gap:6px;justify-content:flex-end} .vacc .btn{padding:6px 10px;min-height:0}
  .vaforo{padding:12px 0;border-bottom:1px solid var(--line)} .vaforo:last-child{border-bottom:0} .vaforo-t{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
  .vbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:4px;flex:1} .vbar i{display:block;height:100%;background:var(--brand-600);border-radius:99px} .vbar i.lleno{background:var(--danger)}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px} .vh2{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:0 0 6px}
  .vdia{display:grid;grid-template-columns:110px 1fr 80px;gap:10px;align-items:center;font-size:13px;padding:3px 0} .vdia .vbar{margin:0} .vdia b{text-align:right}
  @media (max-width:640px){ .vtabla thead{display:none} .vtabla table,.vtabla tbody{display:block} .vtabla tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:10px 12px;border-bottom:1px solid var(--line)} .vtabla tr:last-child{border-bottom:0} .vtabla td{padding:0;border:0;font-size:13px} .vtabla td:first-child{flex-basis:100%} .vtabla td.num{margin-left:auto;font-weight:600} .vtabla td:last-child:not(.num){flex-basis:100%} .vtabla .vacc{justify-content:flex-start} .vdia{grid-template-columns:84px 1fr 70px} }
  .altasec{padding:14px 16px;margin-bottom:12px} .altasec h2{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:0 0 10px}
  .altagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}
  .altares{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px;font-size:14px} .altares li{display:flex;gap:8px;align-items:center} .altares li.ok i{color:var(--ok)} .altares li.dng{color:var(--danger)}
  .lotebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:10px} .lotebar .field{flex:1;min-width:180px}
  .lotesum{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px;font-size:14px}
  .loterow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap} .loterow:last-child{border-bottom:0}
  .loterow input{width:20px;height:20px;flex:none} .loterow .nm{flex:1;min-width:160px}
  .lotetag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--warn-bg,#fff4e5);color:var(--warn,#9a5b00)} .lotetag.dng{background:var(--danger-bg);color:var(--danger)}
  a.btn{text-decoration:none}
  .alpasos{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 14px;flex-wrap:wrap} .alpasos li{flex:1;min-width:0} .alpasos button{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);font:inherit;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .alpasos button span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--text);font-size:12px;font-weight:700;flex:none} .alpasos button.on{border-color:var(--brand-600);color:var(--text);font-weight:600} .alpasos button.on span{background:var(--brand-600);color:#fff} .alpasos button.ok span{background:var(--ok);color:#fff} .alpasos button:disabled{opacity:.5;cursor:not-allowed}
  .alkid .alkidtop{display:flex;gap:8px;align-items:center} .alkid.abierto{border-color:var(--brand-600)}

  .acuerdo{font-size:14.5px;line-height:1.55} .acuerdo p{margin:0 0 10px} .acuerdo h3{font-size:15px;margin:18px 0 8px} .actit{font-size:17px!important;text-transform:none!important;letter-spacing:0!important;color:var(--text)!important;margin:8px 0 8px!important}

<body>
<div id="fk"></div>
<script>
/* CONFIG — mismas URLs de n8n que usa index.html. */
const CONFIG = { WEBHOOK_URL:"https://yoor32.app.n8n.cloud/webhook/fitkid-staff-acciones", AUTH_URL:"https://yoor32.app.n8n.cloud/webhook/fitkid-auth" };
const fk=document.getElementById('fk');
const AUTH={token:null,rol:null,nombre:null,expira:null};
let SECCION='home';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- red (mismo patron que index.html) ---------- */
const SIN_SESION=()=>new Promise(()=>{});
function borrarSesion(){ AUTH.token=null;AUTH.rol=null;AUTH.nombre=null;AUTH.expira=null; }
function sessionExpired(){ const eraKiosco=AUTH.rol==='kiosco'; if(eraKiosco)kioOlvidar(); limpiarKiosco(); borrarSesion(); loginScreen(eraKiosco?'La sesión del kiosco se cerró desde el servidor; vuelve a entrar':'Tu sesión expiró, vuelve a entrar'); }
function doLogout(){ limpiarKiosco(); borrarSesion(); loginScreen(); }
async function call(a,p){ return callUrl(CONFIG.WEBHOOK_URL,{accion:a,...(p||{})}); }
async function callUrl(url,p){
  const tk=AUTH.token; if(!tk)return SIN_SESION();
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8','Authorization':'Bearer '+tk},body:JSON.stringify(p||{})});
    if(r.status===401){ if(AUTH.token===tk)sessionExpired(); return SIN_SESION(); }
    return await r.json();
  }catch(e){ return {ok:false,error:String(e),data:[],red:true}; }
}
async function callAuth(usuario,pass){
  try{
    const r=await fetch(CONFIG.AUTH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:usuario,contrasena:pass})});
    return await r.json();
  }catch(e){ return {ok:false,error:String(e)}; }
}

/* ---------- login ---------- */
function loginScreen(msg){
  let h='<div class="loginwrap">';
  h+='<div class="hero" style="text-align:center"><div class="hlogo" role="img" aria-label="FitKid"></div><div class="htit">CRM · FitKid Gymnastic</div><div class="hsub">Panel administrativo</div></div>';
  h+='<div class="card" style="padding:18px 16px">';
  if(msg)h+='<div class="mut" style="background:var(--danger-bg);color:var(--danger);padding:10px;border-radius:var(--r-sm);margin:0 0 14px">'+esc(msg)+'</div>';
  h+='<div class="mut" style="margin-bottom:6px">Usuario</div><input class="field" id="lu" autocomplete="username">';
  h+='<div class="mut" style="margin-bottom:6px">Contraseña</div><input class="field" id="lp" type="password" autocomplete="current-password">';
  h+='<button class="btn pri" style="width:100%;justify-content:center;margin-top:6px" id="lbtn"><i class="ti ti-login" aria-hidden="true"></i> Entrar</button>';
  h+='<div id="lerr" class="mut" style="margin-top:10px;color:var(--danger)"></div>';
  h+='</div><div class="footer">FitKid Gymnastic · Formando gimnastas, creando Guerreros</div></div>';
  fk.innerHTML=h;
  const lu=fk.querySelector('#lu'),lp=fk.querySelector('#lp'),err=fk.querySelector('#lerr'),btn=fk.querySelector('#lbtn');
  const submit=async()=>{
    const usuario=lu.value.trim(),pass=lp.value;
    if(!usuario||!pass){err.textContent='Escribe usuario y contraseña';return;}
    btn.disabled=true;err.textContent='';
    const r=await callAuth(usuario,pass);
    btn.disabled=false;
    if(!r||r.ok===false||!r.token||!r.rol){err.textContent=(r&&r.error)||'Usuario o contraseña incorrectos';return;}
    if(r.rol==='kiosco'){ const v={token:r.token,nombre:r.nombre||'Kiosco',expira:r.expira||null,modo:null}; kioGuardar(v); arrancarCuentaKiosco(v); return; }
    if(r.rol!=='staff'){err.textContent='Esta cuenta no tiene acceso al CRM';return;}
    AUTH.token=r.token;AUTH.rol=r.rol;AUTH.nombre=r.nombre||null;AUTH.expira=r.expira||null;
    shell();
  };
  btn.onclick=submit;
  lp.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  lu.focus();
}

/* ---------- shell de 3 paneles ---------- */
const NAV=[
  {id:'home', icon:'ti-home', label:'Panel de control', ready:true, movil:true},
  {id:'checkin', icon:'ti-scan', label:'Check-in', ready:true, movil:true},
  {id:'calendario', icon:'ti-calendar', label:'Calendario', ready:true, movil:true},
  {id:'estudiantes', icon:'ti-users', label:'Estudiantes', ready:true, movil:true},
  {id:'ventas', icon:'ti-cash', label:'Ventas', ready:true},
  {id:'eventos', icon:'ti-confetti', label:'Eventos', ready:true},
  {id:'documentos', icon:'ti-file-text', label:'Documentos', ready:true},
  {id:'marketing', icon:'ti-speakerphone', label:'Marketing', ready:true},
  {id:'informes', icon:'ti-chart-bar', label:'Informes', ready:true}
];

function shell(){
  detenerEscaner();
  let h='<div class="mobilebar"><b>FitKid CRM</b><button data-nav="checkin">Check-in</button><button data-act="logout-m">Salir</button></div>';
  h+='<div class="shell">';
  h+='<nav class="navcol"><div class="navbrand"><div class="hlogo" role="img" aria-label="FitKid"></div><b>FitKid CRM</b></div>';
  h+='<ul class="navlist">'+NAV.map(n=>'<li><button data-nav="'+n.id+'" class="'+(SECCION===n.id?'on':'')+'" '+(n.ready?'':'disabled')+'><i class="ti '+n.icon+'" aria-hidden="true"></i> '+n.label+(n.ready?'':'<span class="soon">pronto</span>')+'</button></li>').join('')+'</ul>';
  h+='<div class="navfoot"><button data-act="logout"><i class="ti ti-logout" aria-hidden="true"></i> Cerrar sesión ('+esc(AUTH.nombre||'')+')</button></div>';
  h+='</nav>';
  h+='<main class="centercol" id="centercol"></main>';
  h+='<aside class="rightcol" id="rightpane" aria-label="Detalle"><div class="sheetbar"><button type="button" data-act="cerrar-panel"><i class="ti ti-x" aria-hidden="true"></i> Cerrar</button></div><div id="rightcol"></div></aside>';
  h+='</div>';
  h+='<div class="sheetback" data-act="cerrar-panel"></div>';
  /* En celular caben 5 botones: las 4 secciones del día a día y "Más" con el resto. */
  const enMas=NAV.some(n=>!n.movil&&n.id===SECCION);
  h+='<nav class="tabbar" aria-label="Secciones">'+NAV.filter(n=>n.ready&&n.movil).map(n=>'<button data-nav="'+n.id+'" class="'+(SECCION===n.id?'on':'')+'"><i class="ti '+n.icon+'" aria-hidden="true"></i>'+n.label+'</button>').join('')+'<button type="button" data-act="mas" class="'+(enMas?'on':'')+'"><i class="ti ti-dots" aria-hidden="true"></i>'+(enMas?esc(NAV.find(n=>n.id===SECCION).label):'Más')+'</button></nav>';
  fk.innerHTML=h;
  fk.querySelectorAll('[data-act="cerrar-panel"]').forEach(b=>b.onclick=cerrarPanel);
  fk.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ if(b.disabled)return; SECCION=b.dataset.nav; shell(); });
  const lo=fk.querySelector('[data-act="logout"]'); if(lo)lo.onclick=doLogout;
  const lom=fk.querySelector('[data-act="logout-m"]'); if(lom)lom.onclick=doLogout;
  const mas=fk.querySelector('[data-act="mas"]'); if(mas)mas.onclick=()=>{ const right=document.getElementById('rightcol'); right.innerHTML='<h2>Más secciones</h2>'+NAV.filter(n=>n.ready&&!n.movil).map(n=>'<button type="button" class="venc docpick" data-nav2="'+n.id+'"><span class="nm"><i class="ti '+n.icon+'" aria-hidden="true"></i> '+esc(n.label)+'</span></button>').join(''); right.querySelectorAll('[data-nav2]').forEach(b=>b.onclick=()=>{ cerrarPanel(); SECCION=b.dataset.nav2; shell(); }); abrirPanel(); };
  if(SECCION==='home')home(); else if(SECCION==='checkin')checkin(); else if(SECCION==='estudiantes')estudiantes(); else if(SECCION==='calendario')calendario(); else if(SECCION==='ventas')ventas(); else if(SECCION==='eventos')eventos(); else if(SECCION==='documentos')documentos(); else if(SECCION==='marketing')marketing(); else if(SECCION==='informes')informes(); else placeholder();
}

/* En tablet/celular el panel derecho es una hoja: se abre solo por una acción del usuario
   (tocar un alumno, un tutor o una clase). En escritorio siempre está visible y esto no hace nada. */
function esMovil(){ return window.matchMedia('(max-width:980px)').matches; }
function abrirPanel(){ const p=document.getElementById('rightpane'),b=document.querySelector('.sheetback'); if(!p||!esMovil())return; p.classList.add('open'); if(b)b.classList.add('open'); p.scrollTop=0; }
function cerrarPanel(){ const p=document.getElementById('rightpane'),b=document.querySelector('.sheetback'); if(p)p.classList.remove('open'); if(b)b.classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')cerrarPanel(); });

function placeholder(){
  const n=NAV.find(x=>x.id===SECCION);
  document.getElementById('centercol').innerHTML='<div class="pagehead"><h1>'+esc(n?n.label:'')+'</h1></div><div class="placeholder"><i class="ti ti-tool" style="font-size:28px" aria-hidden="true"></i><div style="margin-top:8px">Este módulo todavía no está construido.</div></div>';
  document.getElementById('rightcol').innerHTML='';
}

/* ---------- Panel de control (Home) ---------- */
async function home(){
  const center=document.getElementById('centercol'), right=document.getElementById('rightcol');
  center.innerHTML='<div class="pagehead"><h1>Panel de control</h1><span class="mut" id="hoy"></span></div><div class="statgrid" id="stats"><div class="mut">Cargando…</div></div><button type="button" class="dayrow solo-movil" id="vermovvenc"><i class="ti ti-calendar-due" aria-hidden="true"></i><span class="nm">Vencimientos próximos</span><i class="ti ti-chevron-right" aria-hidden="true"></i></button>';
  document.getElementById('vermovvenc').onclick=abrirPanel;
  right.innerHTML='<h2>Vencimientos próximos</h2><div class="mut" id="vencbox">Cargando…</div>';
  document.getElementById('hoy').textContent=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});

  const r=await call('resumen_del_dia',{});
  if(SECCION!=='home')return;
  const stats=document.getElementById('stats');
  if(!stats)return;
  if(!r||r.ok===false){ stats.innerHTML='<div class="mut">No se pudo cargar el resumen.</div>'; }
  else{
    const data=r.data||[];
    stats.innerHTML=data.map(s=>'<div class="statcard"><div class="v">'+esc(s.estado)+'</div><div class="l">'+esc(s.n)+'</div></div>').join('')||'<div class="mut">Sin datos para hoy.</div>';
  }

  const v=await call('vencimientos',{});
  if(SECCION!=='home')return;
  const vb=document.getElementById('vencbox');
  if(!vb)return; /* el panel ya muestra otra cosa (p. ej. una ficha abierta desde el inicio) */
  if(!v||v.ok===false){ vb.innerHTML='<div class="mut">No se pudo cargar.</div>'; }
  else{

/* ---------- Check-in (QR, lector USB, código o nombre) y modo kiosco ----------
   El QR de cada alumno lleva un token aleatorio (FK1-…) guardado en Notion; el backend (checkin_qr) marca
   Asistió en su clase de hoy y devuelve alertas. La cámara usa BarcodeDetector si existe y, si no (Safari en
   iPad/iPhone), jsQR. Los lectores USB/Bluetooth escriben el código como teclado + Enter en el campo. */
const JSQR_URL='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
const QRGEN_URL='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
const _libs={};
function cargarScript(url){ if(_libs[url])return _libs[url]; _libs[url]=new Promise((ok,err)=>{const s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=()=>{delete _libs[url];err(new Error('no se pudo cargar '+url));};document.head.appendChild(s);}); return _libs[url]; }
let ESCANER=null; let CHECKINS=[]; let KIOSCO=null;
function detenerEscaner(){ if(!ESCANER)return; ESCANER.vivo=false; try{ESCANER.stream.getTracks().forEach(t=>t.stop());}catch(e){} ESCANER=null; }
/* Abre la cámara trasera dentro de `cont` y llama onCode(texto) por cada QR leído (ignora el mismo código 20 s). */
async function iniciarEscaner(cont,onCode){
  detenerEscaner();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ cont.innerHTML='<div class="mut">Este dispositivo no da acceso a la cámara aquí. Usa un lector USB o escribe el código.</div>'; return false; }
  cont.innerHTML='<div class="camwrap"><video playsinline muted></video><div class="cammark"></div></div><div class="mut" style="margin-top:6px">Apunta al código QR de la tarjeta.</div>';
  const video=cont.querySelector('video'); let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); }
  catch(e){ cont.innerHTML='<div class="mut" style="color:var(--danger)">No se pudo abrir la cámara ('+esc(e.name||e.message||e)+'). Si estás dentro de Duda, el iframe necesita <code>allow="camera"</code>.</div>'; return false; }
  video.srcObject=stream; await video.play().catch(()=>{});
  const st={vivo:true,stream:stream,ultimo:'',ultimoT:0}; ESCANER=st;
  let detector=null; if('BarcodeDetector' in window){ try{ const f=await BarcodeDetector.getSupportedFormats(); if(f.indexOf('qr_code')!==-1)detector=new BarcodeDetector({formats:['qr_code']}); }catch(e){} }
  if(!detector){ try{ await cargarScript(JSQR_URL); }catch(e){ cont.insertAdjacentHTML('beforeend','<div class="mut" style="color:var(--danger)">No se pudo cargar el lector de QR.</div>'); return false; } }
  const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const emitir=txt=>{ const now=Date.now(); if(txt===st.ultimo&&now-st.ultimoT<20000)return; st.ultimo=txt; st.ultimoT=now; if(navigator.vibrate)navigator.vibrate(60); onCode(txt); };
  const tick=async()=>{ if(!st.vivo)return; try{ if(video.readyState>=2){ if(detector){ const r=await detector.detect(video); if(r&&r[0]&&r[0].rawValue)emitir(r[0].rawValue); } else { const w=video.videoWidth,h=video.videoHeight; if(w&&h){ const k=Math.min(1,640/w); canvas.width=w*k; canvas.height=h*k; ctx.drawImage(video,0,0,canvas.width,canvas.height); const img=ctx.getImageData(0,0,canvas.width,canvas.height); const q=window.jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'}); if(q&&q.data)emitir(q.data); } } } }catch(e){} setTimeout(tick,220); };
  tick(); return true;
}

function bloqueDe(nombreHorario){ const m=String(nombreHorario||'').match(/(\d{1,2}:\d{2}-\d{1,2}:\d{2}\s*[AP]M)/i); return m?m[1]:''; }
function visiblesLote(){ return LOTE.data.filter(x=>(LOTE.inact||(x.estatus!=='Suspendido'&&x.estatus!=='Baja'))&&(LOTE.bloque==='*'||(x.horario||'')===LOTE.bloque)&&(!LOTE.q||String(x.nombre).toLowerCase().indexOf(LOTE.q)!==-1)); }
function seleccionLote(){ return visiblesLote().filter(x=>!LOTE.excl.has(x.id)); }
function pintarLote(){
  const l=document.getElementById('lotelista'); if(!l||!LOTE)return; const vis=visiblesLote(), sel=seleccionLote(); const sinq=sel.filter(x=>!x.token).length;
  l.innerHTML=vis.length?vis.map(x=>'<label class="loterow"><input type="checkbox" data-lid="'+esc(x.id)+'"'+(LOTE.excl.has(x.id)?'':' checked')+'><span class="nm">'+esc(x.nombre)+'</span><span class="mut">'+esc(x.cod||'sin código de alumno')+(x.horario?' · '+esc(bloqueDe(x.horario)):'')+'</span>'+(x.token?'':'<span class="lotetag">sin QR</span>')+((x.estatus&&x.estatus!=='Activo')?'<span class="lotetag dng">'+esc(x.estatus)+'</span>':'')+'</label>').join(''):'<div class="mut" style="padding:14px">Nadie coincide con el filtro.</div>';
  l.querySelectorAll('[data-lid]').forEach(c=>c.onchange=()=>{ if(c.checked)LOTE.excl.delete(c.dataset.lid); else LOTE.excl.add(c.dataset.lid); pintarLote(); });
  document.getElementById('loteres').textContent=sel.length+' tarjeta'+(sel.length===1?'':'s')+' · '+Math.ceil(sel.length/8)+' hoja'+(Math.ceil(sel.length/8)===1?'':'s')+(sinq?' · '+sinq+' sin QR todavía (se generan al imprimir)':'');
  const b=document.getElementById('loteimp'); if(b&&!b.dataset.ocupado){ b.disabled=!sel.length; b.innerHTML='<i class="ti ti-printer" aria-hidden="true"></i> Imprimir '+sel.length; }
}
async function imprimirLote(btn){
  const sel=seleccionLote(); if(!sel.length)return; const st=document.getElementById('lotest');
  const faltan=sel.filter(x=>!x.token).map(x=>x.id); btn.disabled=true; btn.dataset.ocupado='1';
  try{
    for(let i=0;i<faltan.length;i+=25){
      st.textContent='Generando códigos '+Math.min(i+25,faltan.length)+' de '+faltan.length+'…';
      const r=await call('qr_lote',{generar:faltan.slice(i,i+25)});
      if(!r||r.ok===false){ st.textContent='Se detuvo: '+((r&&r.error)||'error de red')+'. Los códigos ya creados quedaron guardados; vuelve a pulsar Imprimir.'; return; }
      const tk={}; (r.data||[]).forEach(d=>{ if(d.token)tk[d.id]=d.token; }); LOTE.data.forEach(d=>{ if(!d.token&&tk[d.id])d.token=tk[d.id]; });
    }
    const listos=seleccionLote().filter(x=>x.token);
    st.textContent=listos.length+' tarjetas listas. Si no se abrió el diálogo de impresión, pulsa Imprimir otra vez.';
    await imprimirTarjetas(listos.map(x=>({nombre:x.nombre,cod:x.cod,token:x.token,clase:x.horario})));
  }catch(e){ st.textContent='No se pudo preparar la impresión: '+(e.message||e); }
  finally{ delete btn.dataset.ocupado; btn.disabled=false; pintarLote(); }
}

/* Tarjeta QR del alumno (desde la ficha): imprimir o descargar; regenerar invalida la anterior. */
async function tarjetaQR(regenerar){
  const r=FICHA.r, al=r.al||{}; const root=panelAccion('Tarjeta QR','<div class="mut">Generando…</div>');
  const res=await call('qr_alumno',{alumno_id:FICHA.id,regenerar:!!regenerar});
  if(!res||res.ok===false){ root.querySelector('#accerr').textContent='No se pudo: '+((res&&res.error)||'error'); return; }
  try{ await cargarScript(QRGEN_URL); }catch(e){ root.querySelector('#accerr').textContent='No se pudo cargar el generador de QR'; return; }
  const q=window.qrcode(0,'M'); q.addData(res.token); q.make(); const gif=q.createDataURL(8,4);
  /* qrcode-generator solo produce GIF: se pasa por canvas para que la descarga sea un PNG real. */
  const url=await new Promise(ok=>{ const im=new Image(); im.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=im.width; c.height=im.height; c.getContext('2d').drawImage(im,0,0); ok(c.toDataURL('image/png')); }catch(e){ ok(gif); } }; im.onerror=()=>ok(gif); im.src=gif; });
  root.innerHTML=volverFicha()+'<h2>Tarjeta QR</h2><div class="qrcard" id="qrcard"><img src="'+url+'" alt="Código QR de '+esc(res.nombre)+'"><div class="nm">'+esc(res.nombre)+'</div><div class="mut">'+esc(res.cod||'')+' · FitKid Gymnastic</div></div>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button type="button" class="btn pri" id="qrprint"><i class="ti ti-printer" aria-hidden="true"></i> Imprimir</button><a class="btn" id="qrdl" download="QR-'+esc((res.cod||'alumno').replace(/[^A-Za-z0-9-]/g,''))+'.png" href="'+url+'"><i class="ti ti-download" aria-hidden="true"></i> Descargar</a><button type="button" class="btn" id="qrregen"><i class="ti ti-refresh" aria-hidden="true"></i> Regenerar</button></div>'
   +'<div class="mut" style="font-size:12px;margin-top:8px">Regenerar invalida la tarjeta anterior (úsalo si se perdió).</div><div id="accerr" role="alert" style="color:var(--danger);font-size:13px;margin-top:8px"></div>';
  root.querySelector('[data-acc="volver"]').onclick=drawFicha;
  root.querySelector('#qrprint').onclick=()=>imprimirTarjetas([{nombre:res.nombre,cod:res.cod,token:res.token,clase:(r.horario&&r.horario.nombre)||''}]).catch(()=>{root.querySelector('#accerr').textContent='No se pudo preparar la impresión';});
  root.querySelector('#qrregen').onclick=()=>{ if(confirm('¿Regenerar? La tarjeta actual dejará de funcionar.'))tarjetaQR(true); };
}

/* Firma en pantalla: coordenadas en un lienzo lógico de 600×200 para que se vea igual en cualquier tamaño. */
function iniciarFirma(cv,ac){
  const W=600,H=200, ctx=cv.getContext('2d'); const r=cv.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; const w=r.width||600;
  cv.style.height=Math.round(w*H/W)+'px'; cv.width=Math.round(w*dpr); cv.height=Math.round(w*H/W*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0); ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111';
  ctx.clearRect(0,0,W,H); ac.trazos.forEach(t=>{ ctx.beginPath(); t.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); if(t.length===1)ctx.lineTo(t[0][0]+.5,t[0][1]); ctx.stroke(); });
  const pt=e=>{ const b=cv.getBoundingClientRect(); return [Math.max(0,Math.min(W,Math.round((e.clientX-b.left)/b.width*W))),Math.max(0,Math.min(H,Math.round((e.clientY-b.top)/b.height*H)))]; };
  let cur=null;
  cv.onpointerdown=e=>{ e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(x){} cur=[pt(e)]; ac.trazos.push(cur); };
  cv.onpointermove=e=>{ if(!cur)return; const p=pt(e), q=cur[cur.length-1]; if(Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1])<2)return; ctx.beginPath(); ctx.moveTo(q[0],q[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); cur.push(p); };
  cv.onpointerup=cv.onpointercancel=()=>{ cur=null; };
}

function descargarCSV(nombre,cols,filas){
  /* Sin prefijo, Excel ejecuta como fórmula un texto que empiece con = o @. Los teléfonos (+52…) se dejan tal cual. */
  const q=v=>{ let s=String(v==null?'':v); if(/^[=@]|^[+\-](?!\d)/.test(s))s="'"+s; return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const txt='﻿'+[cols].concat(filas).map(f=>f.map(q).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download=nombre.replace(/[^\w\-áéíóúñÁÉÍÓÚÑ ]+/g,'').trim().replace(/\s+/g,'_')+'.csv';
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}

   UNA llamada (base_familias, ~17 s en producción) que se guarda en memoria y comparten ambas secciones.
   "Actualizar" es explícito: cada consulta es una ejecución de n8n. */
let BASE=null;
async function cargarBase(sec,titulo,forzar){
  if(BASE&&!forzar)return BASE;
  const center=document.getElementById('centercol'), right=document.getElementById('rightcol');
  center.innerHTML='<div class="pagehead"><h1>'+titulo+'</h1></div><div class="mut">Cargando alumnos, tutores y horarios… (unos 15-20 segundos)</div>'; right.innerHTML='';
  const r=await call('base_familias'); if(SECCION!==sec)return null;
  if(!r||r.ok===false){ center.innerHTML='<div class="pagehead"><h1>'+titulo+'</h1></div><div class="placeholder">No se pudo cargar: '+esc((r&&r.error)||'error de red')+'</div>'; return null; }
  const tu={},ho={},al={}; r.tutores.forEach(t=>{tu[t.id]=t;}); r.horarios.forEach(h=>{ho[h.id]=h;}); r.alumnos.forEach(a=>{al[a.id]=a;});
  BASE={r:r,tu:tu,ho:ho,al:al,cargado:new Date(),activos:r.alumnos.filter(a=>a.estatus!=='Suspendido'&&a.estatus!=='Baja')};
  return BASE;

function imprimirListaPapel(hid,mes){

  if(!hojas.length){ toast('No hay alumnos en ese grupo',''); return; }

/* ---------- Marketing ----------
   Segmentos calculados en el navegador con la base ya cargada. WhatsApp no permite envío masivo desde una página:
   cada mensaje se abre en WhatsApp y se envía a mano. Lo "enviado" se recuerda solo en este dispositivo. */
let MKT_SEG='cumple', MKT_MES=null; const MKT_TXT={};
const MKT_SEGS=[
  {id:'cumple',ic:'ti-cake',t:'Cumpleaños',d:'Alumnos que cumplen años en el mes elegido.',tpl:'¡Hola {tutor}! En FitKid Gymnastic le deseamos un muy feliz cumpleaños a {alumno} 🎉 ¡Que disfrute mucho sus {edad} años!'},

  {id:'hermanos',ic:'ti-users-group',t:'Familias con 2 o más hijos',d:'Para promociones familiares.',tpl:'Hola {tutor}, gracias por confiar en FitKid Gymnastic con {alumno}.'},
  {id:'todos',ic:'ti-speakerphone',t:'Todas las familias',d:'Avisos generales: un mensaje por tutor.',tpl:'Hola {tutor}, le escribimos de FitKid Gymnastic: '}
];
function mktPeriodo(seg){ return (seg||MKT_SEG)==='cumple'?(MKT_MES||new Date().toLocaleDateString('en-CA').slice(0,7)):new Date().toLocaleDateString('en-CA').slice(0,7); }
function mktClave(){ return 'fk_mkt_'+MKT_SEG+'_'+mktPeriodo(); }
function mktEnviados(){ try{ return new Set(JSON.parse(localStorage.getItem(mktClave())||'[]')); }catch(e){ return new Set(); } }
function mktMarcar(id){ try{ const s=mktEnviados(); s.add(id); localStorage.setItem(mktClave(),JSON.stringify([...s])); }catch(e){} }
function mktLimpiar(){ try{ localStorage.removeItem(mktClave()); }catch(e){} }
/* Destinatarios del segmento: uno por tutor (con todos sus hijos del segmento), salvo cumpleaños, que es uno por niño. */
function mktDestinatarios(seg){
  const S=seg||MKT_SEG, B=BASE, hoyS=new Date().toLocaleDateString('en-CA'), mesAct=hoyS.slice(0,7);
  const porTutor=(lista,extra)=>{ const g={}; lista.forEach(a=>{ const k=a.tutor_id&&B.tu[a.tutor_id]?a.tutor_id:'al:'+a.id; (g[k]=g[k]||[]).push(a); }); return Object.keys(g).map(k=>{ const t=B.tu[k]||null, als=g[k]; return Object.assign({id:k,tutor:t,alumnos:als,vars:{tutor:t?primerNombre(t.nombre):'',alumno:unirNombres(als.map(a=>primerNombre(a.nombre))),mes:MESES[+mesAct.slice(5,7)-1]}},extra?extra(als):{}); }); };
  if(S==='cumple'){ const mm=mktPeriodo(S).slice(5,7), yy=+mktPeriodo(S).slice(0,4);
    /* Un 1 de enero casi siempre es una fecha capturada solo con el año: no se felicita a nadie con eso. */
    return B.activos.filter(a=>a.fecha_nacimiento&&a.fecha_nacimiento.slice(5,10)!=='01-01'&&a.fecha_nacimiento.slice(5,7)===mm).sort((a,b)=>a.fecha_nacimiento.slice(8,10).localeCompare(b.fecha_nacimiento.slice(8,10))).map(a=>{ const t=B.tu[a.tutor_id]||null; const edad=yy-(+a.fecha_nacimiento.slice(0,4)); return {id:a.id,tutor:t,alumnos:[a],detalle:'Cumple '+edad+' el '+(+a.fecha_nacimiento.slice(8,10))+' de '+MESES[+mm-1],vars:{tutor:t?primerNombre(t.nombre):'',alumno:primerNombre(a.nombre),edad:edad,mes:MESES[+mm-1]}}; }); }
  if(S==='renovar')return porTutor(B.activos.filter(a=>!a.mem||a.mem.mes.slice(0,7)<mesAct),als=>({detalle:'Última membresía: '+unirNombres(als.map(a=>a.mem?nombreMes(a.mem.mes):'nunca'))}));
  if(S==='inscripcion'){ const lim=new Date(hoyS+'T12:00:00'); lim.setDate(lim.getDate()+30); const limS=lim.toLocaleDateString('en-CA');
    const vence=a=>{ if(!a.fecha_inscripcion)return ''; const v=new Date(a.fecha_inscripcion+'T12:00:00'); v.setFullYear(v.getFullYear()+1); return v.toLocaleDateString('en-CA'); };
    const l=B.activos.filter(a=>{ const v=vence(a); return v&&v<=limS; });
    return porTutor(l,als=>{ const v=als.map(vence).sort()[0]; const txt=(v<hoyS?'venció el ':'vence el ')+fechaLargaDoc(v); return {detalle:txt[0].toUpperCase()+txt.slice(1),vars_extra:{vence:txt}}; }).map(d=>{ if(d.vars_extra)Object.assign(d.vars,d.vars_extra); return d; }); }
  if(S==='responsiva')return porTutor(B.activos.filter(a=>!a.responsiva));
  if(S==='espera')return B.r.espera.filter(e=>e.estatus==='En espera'||e.estatus==='Avisado').map(e=>{ const a=B.al[e.alumno_id]||null; const t=B.tu[e.tutor_id]||(a&&B.tu[a.tutor_id])||null; return {id:e.id,tutor:t,alumnos:a?[a]:[],detalle:e.estatus+' desde '+fmtFecha(e.fecha)+(e.notas?' · '+e.notas:''),vars:{tutor:t?primerNombre(t.nombre):'',alumno:a?primerNombre(a.nombre):e.solicitud,mes:''}}; });
  if(S==='hermanos')return porTutor(B.activos.filter(a=>a.tutor_id)).filter(d=>d.alumnos.length>1);
  return porTutor(B.activos);
}

/* ---------- Informes ----------
   UNA llamada (informes, ~35 s en producción: revisa 8 semanas de asistencia) guardada en memoria. Cuando los datos de origen
   no son confiables (sin pagos recientes, clases sin pasar lista) el informe lo dice arriba en vez de mostrar ceros como si fueran reales. */
let INF=null, INF_TAB='alumnos';
async function informes(forzar){
  const center=document.getElementById('centercol'), right=document.getElementById('rightcol');
  if(!INF||forzar){
    center.innerHTML='<div class="pagehead"><h1>Informes</h1></div><div class="mut">Calculando informes… tarda unos 35-40 segundos porque revisa 8 semanas de asistencia.</div>'; right.innerHTML='';
    const r=await call('informes'); if(SECCION!=='informes')return;
    if(!r||r.ok===false){ center.innerHTML='<div class="pagehead"><h1>Informes</h1></div><div class="placeholder">No se pudo cargar: '+esc((r&&r.error)||'error de red')+'</div>'; return; }
    INF=r; INF.cargado=new Date();
  }
  drawInformes();
}
function barras(obj,orden,fmt){ const ks=orden||Object.keys(obj).sort((a,b)=>obj[b]-obj[a]); const max=Math.max(1,...ks.map(k=>Math.abs(obj[k]||0))); return ks.length?ks.map(k=>'<div class="vdia"><span class="mut">'+esc(k)+'</span><div class="vbar"><i style="width:'+Math.max(obj[k]?2:0,Math.round(Math.abs(obj[k]||0)/max*100))+'%"></i></div><b>'+(fmt?fmt(obj[k]||0):(obj[k]||0))+'</b></div>').join(''):'<div class="mut">Sin datos.</div>'; }

  const pctSin=tot.r?Math.round(tot.s/tot.r*100):0; const marcadas=tot.a+tot.f; const pctAsis=marcadas?Math.round(tot.a/marcadas*100):null;
  const diasSinPago=I.ultimo_pago?Math.round((new Date(I.hoy+'T12:00:00')-new Date(I.ultimo_pago+'T12:00:00'))/864e5):null;

  let h='<div class="pagehead"><h1>Informes</h1><button type="button" class="btn" id="infact"><i class="ti ti-refresh" aria-hidden="true"></i> Actualizar</button></div><div class="mut" style="font-size:12px;margin:-10px 0 14px">Datos de las '+I.cargado.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})+' · no se actualiza solo</div>';

    cu.innerHTML='<div class="mut" style="font-size:12.5px;margin-bottom:8px">Del '+esc(fmtFecha(A.desde))+' a ayer. <span class="ileyenda"><i class="asistio"></i> asistió <i class="falta"></i> falta <i class="sin_marcar"></i> sin pasar lista</span></div>'

/* ---------- Calendario (agenda semanal + pasar lista) ---------- */
/* Festivo / cierre: pasa a Cancelado las reservas de ese día. Solo Asistió/Falta consumen crédito
   (fórmula "Consume crédito" en Asistencias), así que cancelar evita que se marquen como falta. Es masivo e irreversible desde el CRM: pide confirmación explícita. */
function hoyLocal(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function cancelarDiaFestivo(){
  const right=document.getElementById('rightcol'); abrirPanel();
  right.innerHTML='<h2>Cancelar clases de un día</h2><div class="mut" style="margin-bottom:10px">Para festivos o cierres. Pasa a Cancelado <b>todas las reservas</b> de esa fecha, así nadie queda con falta ni se le descuenta crédito. Las asistencias ya registradas ese día no se tocan.</div>'+
    '<label class="mut" for="festf">Fecha</label><input type="date" class="field" id="festf" min="'+hoyLocal()+'">'+
    '<label class="chk"><input type="checkbox" id="festok"> Entiendo que se cancelan todas las clases de ese día y no se puede deshacer desde aquí</label>'+
    '<button type="button" class="btn dng acbig" id="festgo"><i class="ti ti-calendar-x" aria-hidden="true"></i> Cancelar clases del día</button><div id="accerr" role="alert" style="color:var(--danger);font-size:13px;margin-top:8px"></div>';
  right.querySelector('#festgo').onclick=async e=>{
    const f=right.querySelector('#festf').value, err=right.querySelector('#accerr');
    if(!f){err.textContent='Elige la fecha';return;}
    if(!right.querySelector('#festok').checked){err.textContent='Confirma que quieres cancelar todo el día';return;}
    const res=await enviar(e.currentTarget,()=>call('cancelar_clase_del_dia',{fecha:f}));
    if(!res)return;
    calendario(); /* redibuja la semana; limpia la columna derecha de forma síncrona, por eso el resultado va después */
    right.innerHTML='<h2>Clases canceladas</h2><div class="chkresp" style="background:var(--ok-bg);color:var(--ok)">'+(res.canceladas||0)+' reservas del '+esc(fmtFecha(f))+' pasaron a Cancelado.</div>'+((res.canceladas||0)===0?'<div class="mut" style="margin-top:8px">No había reservas en esa fecha. Revisa que sea el día correcto.</div>':'');
  };
}
const DN=['Lun','Mar','Mié','Jue','Vie','Sáb'];
let CAL_DESDE=null; let CAL_DIA=null;
function lunesDeHoy(){const d=new Date();const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return d.toISOString().slice(0,10);}
/* Los grupos de niños van separados por género: el nombre del horario termina en "· Niñas" / "· Niños".
   FitParents no lleva género. */
function generoDeHorario(nombre){ const n=String(nombre||''); if(/·\s*Niñas/i.test(n))return 'Niñas'; if(/·\s*Niños/i.test(n))return 'Niños'; return null; }
function chipGenero(g){ return g?'<span class="gchip '+(g==='Niñas'?'nina':'nino')+'">'+g+'</span>':''; }
function nombreSinGenero(nombre){ return String(nombre||'').replace(' (Lun-Vie)','').replace(/\s*·\s*Niñ[ao]s/i,''); }
/* "4:00-5:00 PM" → minutos desde medianoche de la hora de inicio; el AM/PM va al final del rango. */
function minutosBloque(bloque){ const m=String(bloque||'').match(/^(\d{1,2}):(\d{2}).*?(AM|PM)\s*$/i); if(!m)return 9999; let h=+m[1]%12; if(m[3].toUpperCase()==='PM')h+=12; return h*60+(+m[2]); }

async function calendario(){
  if(!CAL_DESDE)CAL_DESDE=lunesDeHoy();
  const center=document.getElementById('centercol'), right=document.getElementById('rightcol');
  right.innerHTML='<h2>Pasar lista</h2><div class="mut">Toca una celda del calendario para ver el roster de esa clase.</div>';
  center.innerHTML='<div class="pagehead"><h1>Calendario</h1></div><div class="weeknav"><button class="btn" id="calprev"><i class="ti ti-chevron-left" aria-hidden="true"></i></button><span class="mut" id="calrango">Cargando…</span><button class="btn" id="calnext"><i class="ti ti-chevron-right" aria-hidden="true"></i></button><button class="btn" id="calhoy" style="margin-left:auto">Esta semana</button><button class="btn" id="calfest" title="Cancelar todas las clases de un día"><i class="ti ti-calendar-x" aria-hidden="true"></i> Día festivo</button></div><div id="calbody" class="mut">Cargando agenda…</div>';
  document.getElementById('calprev').onclick=()=>{const d=new Date(CAL_DESDE+'T12:00:00');d.setDate(d.getDate()-7);CAL_DESDE=d.toISOString().slice(0,10);calendario();};
  document.getElementById('calnext').onclick=()=>{const d=new Date(CAL_DESDE+'T12:00:00');d.setDate(d.getDate()+7);CAL_DESDE=d.toISOString().slice(0,10);calendario();};
  document.getElementById('calhoy').onclick=()=>{CAL_DESDE=lunesDeHoy();calendario();};
  document.getElementById('calfest').onclick=cancelarDiaFestivo;

  const r=await call('agenda_semana',{desde:CAL_DESDE});
  if(SECCION!=='calendario')return;
  const body=document.getElementById('calbody');
  if(!r||r.ok===false){ body.innerHTML='<div class="placeholder">No se pudo cargar la agenda.</div>'; return; }
  const dias=r.dias||[], bloques=(r.bloques||[]).slice().sort((a,b)=>(minutosBloque(a.bloque)-minutosBloque(b.bloque))||String(a.nombre).localeCompare(String(b.nombre))), cel=r.celdas||{};
  document.getElementById('calrango').textContent='Semana del '+CAL_DESDE;
  /* Teléfono: la tabla semanal no cabe; se muestra un día a la vez con selector de días. */
  if(window.matchMedia('(max-width:640px)').matches){
    const hoyISO=new Date().toLocaleDateString('en-CA');
    if(!CAL_DIA||dias.indexOf(CAL_DIA)===-1)CAL_DIA=dias.indexOf(hoyISO)!==-1?hoyISO:dias[0];
    let hd='<div class="caldias" role="tablist">'+dias.map((f,i)=>'<button type="button" role="tab" class="caldia'+(f===CAL_DIA?' on':'')+'" aria-selected="'+(f===CAL_DIA)+'" data-dia="'+f+'">'+DN[i]+'<b>'+f.slice(8)+'</b></button>').join('')+'</div>';
    const del=bloques.map(b=>({b:b,c:cel[CAL_DIA+'|'+b.id]})).filter(x=>x.c);
    hd+=del.length?del.map(x=>'<button type="button" class="dayrow'+(x.c.total>=x.b.cupo?' full':'')+'" data-cell="'+CAL_DIA+'|'+x.b.id+'"><span class="nm">'+esc(nombreSinGenero(x.b.nombre))+chipGenero(generoDeHorario(x.b.nombre))+'</span>'+(x.c.asistio?'<span class="mut">✓'+x.c.asistio+'</span>':'')+'<span class="cnt">'+x.c.total+'<span class="mut" style="font-weight:400">/'+x.b.cupo+'</span></span></button>').join(''):'<div class="placeholder">No hay clases este día.</div>';
    body.innerHTML=hd;
    body.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{CAL_DIA=b.dataset.dia;calendario();});
    body.querySelectorAll('[data-cell]').forEach(btn=>btn.onclick=()=>{ const p=btn.dataset.cell.split('|'); const b=bloques.find(x=>x.id===p[1]); verRoster(p[0],p[1],b?b.nombre:'Clase'); });
    return;
  }
  let h='<div style="overflow:auto"><table class="cal"><thead><tr><th></th>'+dias.map((f,i)=>'<th>'+DN[i]+'<div class="mut" style="font-weight:400">'+f.slice(8)+'</div></th>').join('')+'</tr></thead><tbody>';
  let alguno=false;
  bloques.forEach(b=>{
    let fila='',tieneFila=false;
    dias.forEach(f=>{
      const c=cel[f+'|'+b.id];
      if(!c){fila+='<td></td>';return;}
      tieneFila=true;alguno=true;
      const full=c.total>=b.cupo;
      fila+='<td><button class="calc'+(full?' full':'')+'" data-cell="'+f+'|'+b.id+'">'+c.total+(c.asistio?'<span class="ok2">✓'+c.asistio+'</span>':'')+'</button></td>';
    });
    if(tieneFila)h+='<tr><td class="calb">'+esc(nombreSinGenero(b.nombre))+chipGenero(generoDeHorario(b.nombre))+'</td>'+fila+'</tr>';
  });
  h+='</tbody></table></div>';
  if(!alguno)h='<div class="placeholder">No hay clases agendadas esta semana.</div>';
  body.innerHTML=h;
  body.querySelectorAll('[data-cell]').forEach(btn=>btn.onclick=()=>{
    const p=btn.dataset.cell.split('|'); const b=bloques.find(x=>x.id===p[1]);
    verRoster(p[0],p[1],b?b.nombre:'Clase');
  });
}

async function verRoster(fecha,hid,label){
  const right=document.getElementById('rightcol'); abrirPanel();
  right.innerHTML='<h2>Pasar lista</h2><div class="mut">Cargando '+esc(label)+'…</div>';
  const r=await call('clases_hoy',{fecha:fecha,horario_id:hid});
  const rows=(r&&r.data||[]).map(x=>({id:x.id,n:x.n,cod:x.cod,e:x.e||null}));
  drawRoster(fecha,label,rows);
}

function drawRoster(fecha,label,rows){
  const right=document.getElementById('rightcol');
  const done=rows.filter(c=>c.e).length;
  let h='<h2>Pasar lista</h2><div class="mut" style="margin-bottom:10px">'+esc(label)+' · '+esc(fecha)+' · '+done+'/'+rows.length+'</div>';
  h+=rows.length? rows.map((c,idx)=>'<div class="rosterrow"><div class="miniavatar">'+esc(ini(c.n))+'</div><div style="flex:1;min-width:0"><div class="nm">'+esc(c.n)+'</div><div class="mut">'+esc(c.cod||'')+'</div></div><button class="mkbtn'+(c.e==='Asistió'?' on-ok':'')+'" data-mk="'+idx+'|Asistió"><i class="ti ti-check" aria-hidden="true"></i></button><button class="mkbtn'+(c.e==='Falta'?' on-dng':'')+'" data-mk="'+idx+'|Falta"><i class="ti ti-x" aria-hidden="true"></i></button></div>').join('')
    : '<div class="mut">Sin alumnos en esta clase.</div>';
  /* El botón queda fijo al pie del panel: en rosters largos no hay que bajar hasta el final para guardar. */
  h+='<div class="rosterfoot">';
  if(rows.length)h+='<button class="btn pri" style="width:100%;justify-content:center;min-height:44px" id="guardarlista"><i class="ti ti-device-floppy" aria-hidden="true"></i> Guardar asistencia ('+done+')</button>';
  h+='<div id="rostermsg" class="mut" style="margin-top:8px"></div></div>';
  right.innerHTML=h;
  right.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{
    const p=b.dataset.mk.split('|'); const idx=+p[0];
    rows[idx].e=rows[idx].e===p[1]?null:p[1];
    drawRoster(fecha,label,rows);
  });
  const gb=document.getElementById('guardarlista');
  if(gb)gb.onclick=async()=>{
    const items=rows.filter(c=>c.e).map(c=>({id:c.id,estatus:c.e}));
    gb.disabled=true;
    const r=await call('guardar_asistencias',{items:items});
    gb.disabled=false;
    const msg=document.getElementById('rostermsg');
    if(!r||r.ok!==true){ msg.style.color='var(--danger)'; msg.textContent='Error: '+((r&&r.error)||'no se pudo guardar'); return; }
    msg.style.color='var(--ok)';
    msg.textContent='✓ '+(r.actualizadas!=null?r.actualizadas:items.length)+' asistencia(s) guardada(s)'+(r.rechazados&&r.rechazados.length?(' · '+r.rechazados.length+' rechazadas'):'');
  };
}

/* Una tablet con la cuenta kiosco guardada arranca directo en el kiosco. */
const _kio=kioGuardado(); if(_kio)arrancarCuentaKiosco(_kio); else if(!AUTH.token)loginScreen();
</script>
