<style>
  /* ---- FitKid Design System · tokens ---- */
  :root{
    --brand-700:#0c447c; --brand-600:#185fa5; --brand-500:#2477c9; --brand-bg:#e8f1fb;
    --energy:#ef7d2e; --energy-bg:#fdeede;
    --bg:#eef2f7; --surface:#ffffff; --surface-2:#f7f9fc; --line:#e3e8f0; --line-2:#d3dae6;
    --text:#13151a; --muted:#667085; --hint:#9aa3b2;
    --teal:#0f6e56; --teal-bg:#e1f5ee; --blue:#185fa5; --blue-bg:#e6f1fb; --green:#3b6d11; --green-bg:#eaf3de;
    --purple:#534ab7; --purple-bg:#eeedfe; --pink:#993556; --pink-bg:#fbeaf0; --amber:#854f0b; --amber-bg:#faeeda;
    --ok:#0f6e56; --ok-bg:#e1f5ee; --danger:#a32d2d; --danger-bg:#fcebeb;
    --r-lg:16px; --r:13px; --r-sm:10px; --r-pill:999px;
    --sp-1:6px; --sp-2:10px; --sp-3:14px; --sp-4:18px; --sp-5:24px;
    --sh-sm:0 1px 2px rgba(16,24,40,.05); --sh-md:0 6px 20px rgba(16,30,54,.08); --sh-lg:0 14px 40px rgba(16,30,54,.14);
    --img-hero:url("https://lirp.cdn-website.com/ce8372ef/dms3rep/multi/opt/IMG_8406-1920w.jpg");
    --logo:url("https://lirp.cdn-website.com/ce8372ef/dms3rep/multi/opt/FitKidGimnastic-Logo-89199942-1920w.jpeg");
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;color:var(--text);
    background:radial-gradient(1200px 480px at 80% -8%, #e3edf9 0%, transparent 60%), radial-gradient(900px 420px at -5% 4%, #e6f5ee 0%, transparent 55%), var(--bg);
    -webkit-font-smoothing:antialiased}
  #fk{max-width:800px;margin:0 auto;padding:18px}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--brand-500);outline-offset:2px;border-radius:8px}

  /* ---- hero ---- */
  .hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px 20px;color:#fff;margin-bottom:var(--sp-4);box-shadow:var(--sh-md)}
  .hero::before{content:"";position:absolute;inset:0;background:var(--img-hero) center/cover;transform:scale(1.05);filter:saturate(1.05)}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg, rgba(10,52,95,.94) 0%, rgba(13,95,124,.86) 55%, rgba(29,158,117,.74) 100%)}
  .hero>*{position:relative;z-index:1}
  .row1{display:flex;align-items:center;gap:13px}
  .hlogo{width:46px;height:46px;border-radius:13px;background:#fff var(--logo) center/82% no-repeat;box-shadow:var(--sh-sm);flex:0 0 auto}
  .htit{font-weight:700;font-size:19px;line-height:1.1;letter-spacing:-.2px}
  .hsub{font-size:12.5px;opacity:.92;margin-top:2px}
  .demo{margin-left:auto;font-size:11px;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);padding:5px 11px;border-radius:var(--r-pill)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:var(--sp-4)}
  .stat{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px}
  .stat .v{font-size:19px;font-weight:700;display:flex;align-items:center;gap:6px}
  .stat .l{font-size:11px;opacity:.92;margin-top:1px}

  /* ---- search ---- */
  .search{position:relative;margin-bottom:var(--sp-3)}
  .search i{position:absolute;left:14px;top:13px;color:var(--hint);font-size:18px}
  .search input{width:100%;padding:12px 12px 12px 40px;border:1px solid var(--line);border-radius:var(--r);font-size:14px;font-family:inherit;background:var(--surface);box-shadow:var(--sh-sm);transition:.15s}
  .search input:hover{border-color:var(--line-2)} .search input:focus{border-color:var(--brand-500);outline:none;box-shadow:0 0 0 4px var(--brand-bg)}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:8px;overflow:auto;padding:2px 2px 10px;margin-bottom:var(--sp-3);scrollbar-width:thin}
  .tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 15px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);font-size:13px;color:var(--muted);cursor:pointer;transition:.18s;box-shadow:var(--sh-sm)}
  .tab:hover{border-color:var(--line-2);transform:translateY(-1px)}
  .tab.on{color:#fff;border-color:transparent;box-shadow:var(--sh-md)}
  .tab .cnt{font-size:11px;background:rgba(255,255,255,.25);padding:0 7px;border-radius:var(--r-pill);min-width:18px;text-align:center}
  .tab:not(.on) .cnt{background:var(--surface-2);color:var(--hint)}

  /* ---- section + grid + cards ---- */
  .secline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:0 2px var(--sp-2);font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;animation:rise .22s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .act{position:relative;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:15px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;transition:.16s;box-shadow:var(--sh-sm)}
  .act:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--line-2)}
  .act:active{transform:translateY(-1px)}
  .act .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px}
  .act .t{font-weight:600;font-size:14px;letter-spacing:-.1px}
  .act .d{font-size:12px;color:var(--muted);line-height:1.4}
  .act .star{position:absolute;top:11px;right:11px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:3px}

  /* ---- buttons ---- */
  button{font-family:inherit}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);font-size:14px;cursor:pointer;color:var(--text);transition:.13s;box-shadow:var(--sh-sm)}
  .btn:hover{background:var(--surface-2);border-color:var(--line-2)} .btn:active{transform:scale(.98)}
  .btn.pri{background:var(--brand-600);border-color:var(--brand-600);color:#fff;box-shadow:0 4px 12px rgba(24,95,165,.28)} .btn.pri:hover{background:var(--brand-500)}
  .btn.ok,.btn.on-ok{background:var(--ok-bg);border-color:#bfe3d5;color:var(--ok)}
  .btn.dng,.btn.on-dng{background:var(--danger-bg);border-color:#f0c7c7;color:var(--danger)}

  /* ---- pieces ---- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm)}
  .row{display:flex;align-items:center;gap:11px;padding:12px 15px}
  .row+.row{border-top:1px solid var(--line)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-bg);color:var(--brand-600);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:0 0 auto}
  .nm{font-weight:600;font-size:14px}.mut{font-size:12px;color:var(--muted)}
  .field{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px;margin-bottom:10px;font-family:inherit}
  .field.xl{padding:15px 16px;font-size:16px;min-height:48px}
  .btn.xl{padding:14px 16px;min-height:48px;font-size:15px}
  .field:focus{border-color:var(--brand-500);outline:none;box-shadow:0 0 0 4px var(--brand-bg)}
  .steps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:var(--sp-3);font-size:12px}
  .stp{padding:5px 10px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);color:var(--muted)}
  .stp.on{background:var(--brand-bg);border-color:#bcd9f5;color:var(--brand-600);font-weight:500}
  .toast{margin-top:var(--sp-3);padding:13px 15px;border-radius:var(--r-sm);font-size:14px;text-align:center;animation:rise .2s ease}
  .head{display:flex;align-items:center;gap:11px;margin-bottom:var(--sp-3)}
  .iconbtn{width:40px;height:40px;justify-content:center;padding:0}
  .empty{padding:34px 20px;text-align:center}
  .empty .eic{width:60px;height:60px;border-radius:50%;background:var(--brand-bg);color:var(--brand-600);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px}
  .footer{margin-top:var(--sp-5);text-align:center;font-size:11.5px;color:var(--hint)}
  .livedrop{position:absolute;left:0;right:0;top:48px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);box-shadow:var(--sh-md);max-height:300px;overflow:auto;z-index:30;display:none}
  .livedrop.on{display:block}
  .liveitem{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
  .liveitem:hover{background:var(--surface-2)} .liveitem:last-child{border-bottom:none}
  .cal{border-collapse:separate;border-spacing:4px;width:100%;min-width:520px}
  .cal th{font-size:11px;color:var(--muted);font-weight:600;padding:2px 4px;text-align:center}
  .cal .calb{font-size:11px;color:var(--muted);white-space:nowrap;padding-right:6px}
  .calc{width:100%;min-width:54px;padding:8px 4px;border:1px solid var(--line);border-radius:9px;background:var(--brand-bg);color:var(--brand-600);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
  .calc:hover{border-color:var(--brand-500)}
  .calc.full{background:var(--danger-bg);color:var(--danger)}
  .calc .ok2{display:block;font-size:10px;font-weight:500;color:var(--ok)}

  /* ---- kiosco (check-in manual con foto) ---- */
  body.kiosk-on{background:#0c1420}
  body.kiosk-on #fk{max-width:640px}
  .kiosk-wrap{animation:rise .2s ease}
  .ferr{color:var(--danger);font-size:13px;margin-top:6px}
  .pruebabar{background:var(--amber-bg);color:var(--amber);border:1px solid #e8cfa2;border-radius:var(--r-sm);padding:11px 14px;font-size:14px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .escaner{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:3/4;max-height:60vh;border-radius:14px;overflow:hidden;background:#000}
  .escaner video{width:100%;height:100%;object-fit:cover;display:block}
  .escaner-marco{position:absolute;inset:16% 14%;border:3px solid rgba(255,255,255,.92);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="fk" role="application" aria-label="Panel del staff FitKid"></div>
<script>
/* CONFIG — pega la URL del router de webhooks de n8n. Vacío = MODO DEMO. */
const CONFIG = { WEBHOOK_URL:"https://yoor32.app.n8n.cloud/webhook/fitkid-staff-acciones", AUTH_URL:"https://yoor32.app.n8n.cloud/webhook/fitkid-auth", QR_URL:"https://yoor32.app.n8n.cloud/webhook/fitkid-qr-scan", CHAT_URL:"https://yoor32.app.n8n.cloud/webhook/140c2254-cd40-40f0-a9ec-3d3cbe25199c/chat", STRIPE_URL:"https://yoor32.app.n8n.cloud/webhook/fitkid-stripe-link" };
/* MOCK_VERIFICAR: true = guardar la verificación NO llama al backend (la acción
   'verificar_alumno' todavía no existe en el router de n8n). Cámbialo a false cuando el
   endpoint esté publicado: es lo único que hay que tocar, el resto del código no sabe si
   está simulando. */
const MOCK_VERIFICAR=false;
/* MOCK_ESCANER: true = el escáner y el check-in NO llaman al backend (fitkid-qr-scan,
   estado_checkin, registrar_en_clase y agregar_lista_espera todavía no existen en n8n).
   Simula los tres escenarios por turnos: con clase hoy, sin clase con cupo y sin clase
   con el bloque lleno. Cámbialo a false cuando los endpoints estén publicados. */
const MOCK_ESCANER=true;
const fk=document.getElementById('fk'); const DEMO=!CONFIG.WEBHOOK_URL; const state={lote:0}; let PRE=null;
/* Token de sesión: SOLO en memoria. Nunca localStorage/sessionStorage/cookies. Se pierde al recargar. */
const AUTH={token:null,rol:null,nombre:null,expira:null};
/* Estado del kiosco manual (botón "Abrir kiosco"): SOLO en memoria, incluida la cola sin conexión. */
let KIOSK=null;

const GROUPS=[
  {id:'asistencia',name:'Asistencia y clases',icon:'checklist',color:'teal',actions:[
    {k:'pasar_lista_dia',t:'Pasar lista',d:'Marcar Asistió/Falta del día',i:'checklist',star:1},
    {k:'marcar_asistencia',t:'Marcar asistencia',d:'Un alumno llegó',i:'user-check'},
    {k:'marcar_falta',t:'Marcar falta',d:'Consume crédito',i:'user-x'},
    {k:'reagendar_clase',t:'Reagendar clase',d:'Mover a otra fecha (24 h)',i:'calendar-event'},
    {k:'reponer_clase',t:'Reponer clase',d:'Clase extra sin crédito',i:'calendar-plus'},
    {k:'cancelar_clase_dia',t:'Cancelar clase del día',d:'Festivo: libera crédito',i:'calendar-x'},
  ]},
  {id:'alumnos',name:'Alumnos y membresías',icon:'users',color:'blue',actions:[
    {k:'alta_alumno',t:'Alta de alumno',d:'Nuevo registro + membresía',i:'user-plus'},
    {k:'renovar_mensualidad',t:'Renovar mensualidad',d:'Crea la membresía del mes',i:'refresh'},
    {k:'cambiar_plan_o_horario',t:'Cambiar plan/horario',d:'Créditos, bloque y días',i:'clock-edit'},
    {k:'suspender_reactivar',t:'Suspender / reactivar',d:'Pausa o reactiva',i:'user-off'},
    {k:'aplicar_regla_3_meses',t:'Regla 3 meses',d:'Pierde inscripción ($500)',i:'alert-octagon'},
    {k:'consultar_saldo_creditos',t:'Saldo de créditos',d:'Créditos restantes',i:'coins',star:1},
  ]},
  {id:'cobranza',name:'Pagos y cobranza',icon:'cash',color:'green',actions:[
    {k:'registrar_pago',t:'Registrar pago',d:'Mensualidad / inscripción',i:'cash',star:1},
    {k:'generar_link_stripe',t:'Link de pago',d:'Enviar link Stripe al tutor',i:'link'},
    {k:'registrar_reembolso',t:'Reembolso',d:'Registrar devolución',i:'receipt-refund'},
    {k:'quien_debe',t:'Quién debe',d:'Pagos pendientes',i:'alert-triangle',star:1},
    {k:'corte_del_dia',t:'Corte del día',d:'Total cobrado por método',i:'report-money'},
  ]},
  {id:'reportes',name:'Reportes y operación',icon:'chart-bar',color:'purple',actions:[
    {k:'resumen_del_dia',t:'Resumen del día',d:'Asistencias, ingresos, altas',i:'layout-dashboard',star:1},
    {k:'aforo_por_horario',t:'Aforo por horario',d:'Ocupados / disponibles',i:'users-group'},
    {k:'vencimientos',t:'Vencimientos',d:'Inscripciones por vencer',i:'calendar-stats'},
    {k:'buscar_familia_alumno',t:'Buscar familia',d:'Ficha y contacto del tutor',i:'address-book'},
    {k:'eventos',t:'Eventos',d:'Próximos eventos e inscritos',i:'confetti'},
  ]},
  {id:'extras',name:'Extras',icon:'sparkles',color:'pink',actions:[
    {k:'lista_de_espera',t:'Lista de espera',d:'Cuando un bloque está lleno',i:'hourglass'},
    {k:'avisar_tutores',t:'Avisar a tutores',d:'Email a un grupo',i:'mail'},
    {k:'morosos_del_mes',t:'Morosos del mes',d:'No han pagado este mes',i:'alert-circle'},
  ]},
  {id:'eventos',name:'Eventos',icon:'confetti',color:'amber',actions:[
    {k:'crear_evento',t:'Crear evento',d:'Nuevo evento (cupo y edad)',i:'calendar-plus'},
    {k:'inscribir_a_evento',t:'Inscribir a evento',d:'Inscribe y cobra (opcional)',i:'user-plus',star:1},
    {k:'eventos',t:'Ver eventos',d:'Próximos e inscritos',i:'confetti'},
  ]},
];
const MOCK={
  resumen:{clases:18,cobrado:4300,pend:2},
  clases_hoy:[{id:'c1',n:'Valentino García',cod:'26-VG-003',e:null},{id:'c2',n:'César Bastarrachea',cod:'26-CAB-019',e:null},{id:'c3',n:'Aurora Díaz',cod:'26-ADM-013',e:null},{id:'c4',n:'Frida Estrella',cod:'26-FRE-021',e:null}],
  alumnos:[{id:'a1',nombre:'Valentino García',cod:'26-VG-003',plan:'M8',monto:1500},{id:'a2',nombre:'Abel Jr Sansores',cod:'26-ASA-001',plan:'M4',monto:1100}],
  quien_debe:[{n:'(membresía de prueba)',estado:'Vencido'},{n:'(membresía de prueba)',estado:'Pendiente'}],
  vencimientos:[{n:'Abel Jr Sansores',estado:'vence 2027-02-10'},{n:'Valentino García',estado:'vence 2027-02-20'}],
  aforo_por_horario:[{n:'Olímpica 6-7 PM',estado:'30/30 · lleno'},{n:'Olímpica 7-8 PM',estado:'21/30'},{n:'Iniciación 4-5 PM',estado:'28/30'}],
};
/* Sin sesión o con 401 la promesa queda pendiente: así el flujo que llamó no vuelve a pintar su pantalla encima del login. */
const SIN_SESION=()=>new Promise(()=>{});
async function call(a,p){ if(DEMO){await new Promise(r=>setTimeout(r,220));return{demo:1,data:MOCK[a]||[]};} return callUrl(CONFIG.WEBHOOK_URL,{accion:a,...(p||{})}); }
async function callUrl(url,p){ if(!url){return {ok:false,error:'sin URL'};} const tk=AUTH.token; if(!tk)return SIN_SESION(); try{ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8','Authorization':'Bearer '+tk},body:JSON.stringify(p||{})}); if(r.status===401){ if(AUTH.token===tk)sessionExpired(); return SIN_SESION(); } return await r.json(); }catch(e){ return {ok:false,error:String(e),data:[],red:true}; } }
/* wf-auth necesita application/json: con text/plain n8n no parsea el cuerpo y responde 401. */
async function callAuth(usuario,pass){ try{ const r=await fetch(CONFIG.AUTH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:usuario,contrasena:pass})}); return await r.json(); }catch(e){ return {ok:false,error:String(e)}; } }
function borrarSesion(){ AUTH.token=null;AUTH.rol=null;AUTH.nombre=null;AUTH.expira=null; detenerKiosco(); detenerEscaner(); }
function sessionExpired(){ borrarSesion(); loginScreen('Tu sesión expiró, vuelve a entrar'); }
function doLogout(){ borrarSesion(); loginScreen(); }
function errorStaff(r){
  if(!r)return 'No se pudo completar. Intenta de nuevo.';
  if(r.red)return 'Sin conexión. Revisa el internet e intenta de nuevo.';
  const e=String(r.error||'');
  if(/rol no puede/i.test(e))return 'Tu cuenta no tiene permiso para esta acción. Pídesela a un usuario de staff.';
  return e?('No se pudo completar: '+e):'No se pudo completar. Intenta de nuevo.';
}
function detalleRechazos(r){
  const rech=(r&&r.rechazados)||[];
  if(!rech.length)return '';
  return rech.map(x=>typeof x==='string'?x:(x.motivo||x.error||x.id||'')).filter(Boolean).join(', ');
}
function cv(c){return getComputedStyle(document.documentElement).getPropertyValue('--'+c).trim();}
function ini(n){return n.split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();}
function calcEdad(fISO){ if(!fISO)return null; const bd=new Date(fISO+'T00:00:00'); if(isNaN(bd.getTime()))return null; const hoy=new Date(); let e=hoy.getFullYear()-bd.getFullYear(); const m=hoy.getMonth()-bd.getMonth(); if(m<0||(m===0&&hoy.getDate()<bd.getDate()))e--; return e; }
function categoriaDeEdad(edad){ if(edad==null)return null; if(edad>=3&&edad<=6)return 'Iniciación Deportiva'; if(edad>=7&&edad<=14)return 'Gimnasia Olímpica'; return null; }
/* El programa SOLO se deduce del nombre del bloque. Deducirlo de la hora sería falso: el catálogo
   tiene bloques distintos a la misma hora (FitParents 7-8 PM y Olímpica 7-8 PM). Si el nombre no lo
   dice, devuelve null y arriba se trata como "Requiere revisión". */
function categoriaDeHorario(nombre){ if(!nombre)return null; const n=String(nombre).toLowerCase(); if(n.indexOf('fitparent')!==-1)return 'FitParents'; if(n.indexOf('olímpic')!==-1||n.indexOf('olimpic')!==-1)return 'Gimnasia Olímpica'; if(n.indexOf('iniciaci')!==-1)return 'Iniciación Deportiva'; return null; }

/* Cabecera con el resumen del día. Antes mostraba MOCK.resumen (18 clases, $4,300) también en producción;
   ahora en producción pinta "—" y cargarResumen() la llena con resumen_del_dia. */
let RESUMEN=null,RESUMEN_T=0;

function programaDeHorario(nombre){ const c=categoriaDeHorario(nombre); return c==='FitParents'?PROG.fp:c==='Gimnasia Olímpica'?PROG.oli:c==='Iniciación Deportiva'?PROG.ini:PROG.rev; }
/* "Olímpica 6-7 PM (Lun-Vie)" → "6:00-7:00 PM". Devuelve null salvo que la hora se deduzca
   sin ambigüedad Y coincida en programa con el bloque: meter a un adulto de FitParents en la
   clase de 3 a 6 años (o al revés) es peor que pedirle al staff que elija la hora a mano. */
function horaDeBloque(nombre){
  const m=String(nombre||'').match(/(\d{1,2})(?::(\d{2}))?\s*(?:-|–|a)\s*(\d{1,2})(?::(\d{2}))?\s*([ap])\.?\s*m\.?/i);
  if(!m)return null;
  const v=m[1]+':'+(m[2]||'00')+'-'+m[3]+':'+(m[4]||'00')+' '+(m[5].toLowerCase()==='a'?'AM':'PM');
  const cand=HORAS.filter(h=>h===v||h.indexOf(v+' (')===0);
  if(cand.length!==1)return null;
  /* Las opciones "(FitParents)" son solo de adultos; las de la tarde las comparten ambos programas. */
  if(/FitParents/i.test(cand[0])&&categoriaDeHorario(nombre)!=='FitParents')return null;
  return cand[0];
}
/* Grupos de niños separados por género. Los horarios traen genero ('Niña'|'Niño') desde el backend;
   FitParents trae null y lo ve cualquiera. */
function generoOk(g){return (g==='Niña'||g==='Niño')?g:'';}
function bloqueParaGenero(b,g){return !b.genero||b.genero===g;}
/* Ordena por hora de inicio ("4:00-5:00 PM" → 16:00); el AM/PM va al final del rango. */
function minutosBloque(bl){const m=String(bl||'').match(/^(\d{1,2}):(\d{2}).*?(AM|PM)\s*$/i);if(!m)return 9999;let h=+m[1]%12;if(m[3].toUpperCase()==='PM')h+=12;return h*60+(+m[2]);}
function ordenarBloques(arr){return arr.slice().sort((a,b)=>(minutosBloque(a.bloque)-minutosBloque(b.bloque))||String(a.nombre).localeCompare(String(b.nombre)));}
function tel52(t){const d=String(t||'').replace(/\D/g,'').slice(-10);return d.length===10?('+52'+d):'';}
/* Único punto de guardado de la verificación. Con MOCK_VERIFICAR en true no toca la red. */
async function guardarVerificacion(payload){
  const falta=(!payload.nombre&&'el nombre del alumno')||(!payload.fecha_nacimiento&&'la fecha de nacimiento')||(!payload.alergias&&'las alergias')||(!payload.horario_id&&'el horario')||(!(payload.dias&&payload.dias.length)&&'los días');
  if(falta)return {ok:false,error:'Falta '+falta+'.'};
  if(!MOCK_VERIFICAR)return call('verificar_alumno',payload);
  await new Promise(r=>setTimeout(r,400));
  const edad=calcEdad(payload.fecha_nacimiento),sug=categoriaSugerida(edad);
  return {ok:true,alumno_id:payload.alumno_id,edad:edad,categoria_sugerida:sug,
    alerta_edad_horario:!!(sug&&PROG_INFANTIL[sug]&&PROG_INFANTIL[payload.programa]&&sug!==payload.programa),
    tutor_id:'simulado',tutor_creado:false,simulado:true};
}
function verificarAlumno(a,pre,ctx){

    emerg_nombre:pre.emergencia_nombre||tu.contacto_emergencia||'',emerg_tel:pre.emergencia_telefono||d10(tu.telefono_emergencia),parentesco:pre.parentesco||tu.parentesco||'',alergias:pre.alergias||'',
    genero:generoOk(pre.genero),horario_id:(ctx.horario&&ctx.horario.id)||pre.horario_id||null,horario_nombre:null,hora_manual:'',dias:new Set((pre.dias||[]).filter(d=>DIAS.indexOf(d)!==-1)),bloques:[]};
  const hoy=new Date().toLocaleDateString('en-CA');

  const campo=(id,label,val,attrs)=>'<label class="mut" for="'+id+'" style="display:block;margin:16px 0 6px">'+label+'</label><input class="field xl" style="margin-bottom:0" id="'+id+'" value="'+esc(val)+'" '+(attrs||'')+'><div class="ferr" id="e-'+id+'" role="alert"></div>';
  const $=id=>fk.querySelector('#'+id);

  async function cargar(){
    fk.innerHTML=back('Verificación de alumno')+'<div class="mut">Cargando horarios…</div>';bindNav();
    const hl=await call('horarios_lista',{});
    V.bloques=hl.data||[];
    const b=V.bloques.filter(x=>x.id===V.horario_id)[0];
    if(b&&bloqueParaGenero(b,V.genero))V.horario_nombre=b.nombre;else V.horario_id=null;

  function draw(){

    h+='<div class="toast" style="animation:none;background:var(--brand-bg);color:var(--brand-600);text-align:left;margin:0"><i class="ti ti-shield-check" aria-hidden="true"></i> Primera visita a front desk: confirma los datos con el tutor antes de continuar.</div>';

    h+='<div class="mut" style="margin:20px 0 6px">Género del alumno</div><div class="grid" style="grid-template-columns:1fr 1fr;gap:8px">'+['Niña','Niño'].map(g=>'<button type="button" class="btn xl" style="justify-content:center" data-gen="'+g+'">'+g+'</button>').join('')+'</div><div class="ferr" id="e-gen" role="alert"></div>';

    fk.innerHTML=h;bindNav();
    [['vnm','nombre'],['vtn','tutor_nombre'],['vtc','tutor_correo'],['vtw','tutor_whats'],['vpa','parentesco'],['ven','emerg_nombre'],['vet','emerg_tel'],['val','alergias']].forEach(function(x){$(x[0]).oninput=function(){V[x[1]]=$(x[0]).value;limpiarErr('e-'+x[0]);};});
    const fn=$('vfn');fn.oninput=fn.onchange=()=>{V.fnac=fn.value;limpiarErr('e-vfn');actualizar();};
    fk.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>{V.genero=b.dataset.gen;const sel=V.bloques.filter(x=>x.id===V.horario_id)[0];if(sel&&!bloqueParaGenero(sel,V.genero)){V.horario_id=null;V.horario_nombre=null;V.hora_manual='';}draw();});
    fk.querySelectorAll('[data-bk]').forEach(b=>b.onclick=()=>{V.horario_id=b.dataset.bk;V.horario_nombre=b.dataset.nm;V.hora_manual='';limpiarErr('e-bloque');actualizar();});
    fk.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{const d=b.dataset.dia;
      if(V.dias.has(d))V.dias.delete(d);
      else if(maxDias!=null&&V.dias.size>=maxDias){$('e-dias').textContent='Su plan permite '+maxDias+' día'+(maxDias===1?'':'s')+' por semana. Quita uno para elegir otro.';return;}
      else V.dias.add(d);
      limpiarErr('e-dias');actualizar();});
    $('vguardar').onclick=guardar;
    actualizar();
  }
  function limpiarErr(id){const e=$(id);if(e)e.textContent='';}
  function actualizar(){
    const edad=calcEdad(V.fnac),futura=edad!=null&&edad<0;
    const catEdad=categoriaDeEdad(edad),catH=categoriaDeHorario(V.horario_nombre),sug=categoriaSugerida(edad);
    const txt=(!futura&&edad!=null&&catH&&programaDeHorario(V.horario_nombre)!==sug)?'Este horario es de '+catH+' pero el alumno tiene '+edad+(edad===1?' año':' años')+'. Confirma con el tutor antes de guardar.':'';
    let h='';

  /* La hora se saca del nombre del bloque; si no se puede, el staff la elige (es un select de Notion). */

    cont.innerHTML='<label class="mut" for="vho" style="display:block;margin:16px 0 6px">Hora de clase</label><select class="field xl" id="vho" style="margin-bottom:0"><option value="">Elige la hora…</option>'+HORAS.map(x=>'<option value="'+esc(x)+'"'+(V.hora_manual===x?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select><div class="ferr" id="e-vho" role="alert"></div>';

  async function guardar(){

    btn.disabled=true;$('verr').textContent='Guardando…';

  }else{err.textContent='Este dispositivo no soporta cámara aquí. Continúa sin foto.';}

function registrarCheckin(a,fotoBase64){

    const okAsistencia=r1&&r1.ok===true&&!(r1.rechazados&&r1.rechazados.length);
    if(okAsistencia){
      let sinFoto=false;
      if(fotoBase64){const r2=await call('guardar_foto_alumno',{alumno_id:a.id,foto_base64:fotoBase64});sinFoto=!(r2&&r2.ok!==false);}

const SIM={ciclo:0,alumnos:{}};
async function apiCheckin(que,p,alumnoId){
  const payload=Object.assign({},p||{});
  const nombre=payload.nombre_simulado;delete payload.nombre_simulado; /* solo sirve para simular */
  if(!MOCK_ESCANER)return que==='qr'?callUrl(CONFIG.QR_URL,payload):call(que,payload);

function simularCheckin(que,p){
  const id=p.alumno_id||('sim-'+String(p.qr_token||'').slice(-8));
  if(!SIM.alumnos[id])SIM.alumnos[id]={escenario:(SIM.ciclo++)%3,cobrada:false,registrado:false,espera:false,nombre:p.nombre_simulado||('Alumno de prueba '+(SIM.ciclo))};
  const st=SIM.alumnos[id];
  if(p.nombre_simulado)st.nombre=p.nombre_simulado;
  if(que==='guardar_asistencias'){st.cobrada=true;return {ok:true,actualizadas:1,recibidos:1,rechazados:[],simulado:true};}
  if(que==='registrar_en_clase'){st.registrado=true;return {ok:true,asistencia_id:'sim-asi',simulado:true};}
  if(que==='agregar_lista_espera'){st.espera=true;return {ok:true,id:'sim-espera',posicion:2,simulado:true};}
  const d=new Date(),hoyISO=d.toLocaleDateString('en-CA');d.setDate(d.getDate()+1);

    creditos_restantes:6,creditos_total:8,estado_pago:'Pagado',estatus:'Activo'};

    return {ok:true,simulado:true,alumno:alumno,
      clase_hoy:{asistencia_id:'sim-asi',horario_id:'sim-h',bloque:'Olímpica · 6:00-7:00 PM',fecha:hoyISO,hora:'6:00-7:00 PM',estado:st.cobrada?'Asistió':'Reservado'},
      siguiente_clase:null,accion_sugerida:st.cobrada?'ninguna':'cobrar_asistencia'};
  }
  const lleno=st.escenario===2;
  return {ok:true,simulado:true,alumno:alumno,clase_hoy:null,
    siguiente_clase:{horario_id:'sim-h2',bloque:'Olímpica · 7:00-8:00 PM',fecha:manana,hora:'7:00-8:00 PM',cupo:30,ocupados:lleno?30:25,en_espera:st.espera},

function escanearTarjeta(){
  detenerEscaner();

    '<div class="card" style="padding:12px"><div class="escaner"><video id="evid" playsinline muted autoplay></video><div class="escaner-marco" aria-hidden="true"></div></div>'+
    '<div id="eest" role="status" class="mut" style="margin-top:10px;font-size:14px;text-align:center">Abriendo la cámara…</div></div>'+
    btnGrande('chk-buscar','search','Buscar alumno por nombre');
  bindNav();bindCheckinNav();
  if(!('BarcodeDetector' in window))return camaraNoDisponible('soporte');
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return camaraNoDisponible(window.isSecureContext?'soporte':'insegura');
  const video=fk.querySelector('#evid'),est=fk.querySelector('#eest');
  const yo={timer:null,stream:null,onVis:null};
  ESCANER=yo;
  yo.onVis=()=>{if(document.hidden&&ESCANER===yo){detenerEscaner();escaneoEnPausa();}};
  document.addEventListener('visibilitychange',yo.onVis);
  (async()=>{
    let formatos=[];
    try{formatos=await BarcodeDetector.getSupportedFormats();}catch(e){}
    if(ESCANER!==yo)return;
    if(formatos.indexOf('qr_code')===-1){detenerEscaner();return camaraNoDisponible('soporte');}
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});}
    catch(err){
      if(ESCANER!==yo)return;
      detenerEscaner();
      const n=err&&err.name;
      return camaraNoDisponible(n==='NotAllowedError'||n==='SecurityError'?'permiso':(n==='NotFoundError'||n==='OverconstrainedError')?'nohay':(n==='NotReadableError'||n==='AbortError')?'ocupada':'soporte');
    }
    if(ESCANER!==yo||!video.isConnected){stream.getTracks().forEach(t=>t.stop());return;}
    yo.stream=stream;video.srcObject=stream;
    try{await video.play();}catch(e){}
    est.textContent='Apunta la cámara al código QR de la tarjeta.';
    const det=new BarcodeDetector({formats:['qr_code']});
    const tick=async()=>{
      if(ESCANER!==yo)return;
      if(!video.isConnected){detenerEscaner();return;}
      try{
        if(video.readyState>=2){
          const c=(await det.detect(video)).find(x=>x.rawValue&&x.rawValue.trim());
          if(c&&ESCANER===yo){detenerEscaner();if(navigator.vibrate)navigator.vibrate(60);return procesarQR(c.rawValue.trim());}
        }
      }catch(e){}
      if(ESCANER===yo)yo.timer=setTimeout(tick,180);
    };
    tick();
  })();
}

function fechaClase(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return iso||'';
  const d=new Date(),hoyISO=d.toLocaleDateString('en-CA');d.setDate(d.getDate()+1);
  if(iso===hoyISO)return 'Hoy';
  if(iso===d.toLocaleDateString('en-CA'))return 'Mañana';
  const t=new Date(iso+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  return t.charAt(0).toUpperCase()+t.slice(1);
}

    };
  };
  if(hoy)ejecutar('chk-cobrar','guardar_asistencias',{items:[{id:hoy.asistencia_id,estatus:'Asistió'}]},
    x=>Number(x.actualizadas)>=1&&!(x.rechazados&&x.rechazados.length),()=>'✓ Asistencia registrada y crédito cobrado.');
  if(sig){
    const p={alumno_id:al.id,horario_id:sig.horario_id,fecha:sig.fecha};
    ejecutar('chk-registrar','registrar_en_clase',p,x=>!!x.asistencia_id,()=>'✓ Registrado en '+(sig.bloque||'la clase')+' · '+fechaClase(sig.fecha)+'.',
      x=>{if(!(x&&x.lleno))return false;resultadoCheckin(Object.assign({},r,{siguiente_clase:Object.assign({},sig,{ocupados:sig.cupo})}),'Esa clase se acaba de llenar. Puedes agregarlo a la lista de espera.','warn');return true;});
    ejecutar('chk-espera','agregar_lista_espera',p,x=>!!x.id,x=>'✓ Agregado a la lista de espera'+(x.posicion?' (lugar '+x.posicion+')':'')+'.');
  }
}
function bindNav(){fk.querySelectorAll('[data-lote]').forEach(t=>t.onclick=()=>{state.lote=+t.dataset.lote;home();});fk.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>route(b.dataset.go));const hm=fk.querySelector('[data-act="home"]');if(hm)hm.onclick=()=>home();const lo=fk.querySelector('[data-act="logout"]');if(lo)lo.onclick=doLogout;let _ls;const lbx=fk.querySelector('#livebx');if(lbx){const rb=fk.querySelector('#liveres');const runls=async(q)=>{if(!q||q.length<2){rb.className='livedrop';rb.innerHTML='';return;}const r=await call('buscar_alumno',{nombre:q});const arr=(r&&r.data)||[];if(!arr.length){rb.className='livedrop on';rb.innerHTML='<div class="liveitem" style="cursor:default"><span class="mut">Sin resultados</span></div>';return;}rb.innerHTML=arr.map(a=>'<div class="liveitem" data-al="'+a.id+'"><div class="avatar" style="width:30px;height:30px;font-size:12px">'+ini(a.nombre)+'</div><div style="flex:1"><div class="nm" style="font-size:13px">'+a.nombre+'</div><div class="mut">'+a.cod+(a.plan?(' · plan '+a.plan):'')+'</div></div><i class="ti ti-chevron-right mut" aria-hidden="true"></i></div>').join('');rb.className='livedrop on';rb.querySelectorAll('[data-al]').forEach(it=>it.onclick=()=>{const a=arr.find(x=>x.id===it.dataset.al);rb.className='livedrop';fichaAlumno(a);});};lbx.oninput=()=>{clearTimeout(_ls);const q=lbx.value.trim();_ls=setTimeout(()=>runls(q),230);};}const lb=fk.querySelector('[data-act="libre"]');if(lb)lb.onclick=()=>{if(CONFIG.CHAT_URL)window.open(CONFIG.CHAT_URL,'_blank');else alert('Configura CONFIG.CHAT_URL con la URL del chat de n8n.');};const kb=fk.querySelector('[data-act="kiosco"]');if(kb)kb.onclick=()=>abrirKiosco();const eb=fk.querySelector('[data-act="escanear"]');if(eb)eb.onclick=()=>escanearTarjeta();}
if(DEMO){AUTH.token='demo';AUTH.rol='staff';home();}else{loginScreen();}
